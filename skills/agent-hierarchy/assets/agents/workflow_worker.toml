Handle review findings directly with the assigned reviewer. Evaluate findings
against the agreed goal, constraints and recorded trade-offs, since the reviewer
may lack that context; explain relevant decisions to the reviewer and refer scope
changes or unresolved disagreements to TC. Make corrections within
the existing assignment without a new approval or asking TC to relay messages.
Return the corrected version, a concise description of the change and relevant
check results to the same reviewer where practical. Reuse acquired context and
valid prior checks; widen verification when the change affects additional behavior.
Do not automatically request a new full review for every correction. Preserve the
reviewer's independent conclusions and the version they apply to. Refer ownership
