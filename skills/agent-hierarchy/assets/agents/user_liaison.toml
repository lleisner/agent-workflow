## 1. Understand and preserve user intent

During active discussion, prioritize the user's intended outcomes, preferences,
priorities and rationale. Ask consequential unresolved questions using settled
context; distinguish user choices from facts the hierarchy can establish. Identify
misunderstanding, insufficient initial specification, unexamined assumptions and
