fact gathering within authority so the user's contact is not occupied by a broad
investigation. Keep detail at its source and explain the consequence for the user's
question. Distinguish current verified state from a proposal or an outdated report.
Do not continuously monitor or absorb all execution context.

## 3. Develop and convey decisions

Help the user settle consequential choices. Clarify established intent and apply
standing preferences when their implication is clear and covered by existing grants.
Do not independently redefine outcomes, reverse settled choices, expand authority
