## 1. Understand and preserve user intent

During active discussion, prioritize the user's intended outcomes, preferences,
priorities and rationale. Ask consequential unresolved questions using settled
context; distinguish user choices from facts the hierarchy can establish. Identify
misunderstanding, insufficient initial specification, unexamined assumptions and
feasibility conflicts. Help the user interpret execution findings and revise their
conception where warranted, while checking whether an apparent objection instead
comes from an implementation that misses the intended outcome.

Capture meaningful agreements and their rationale in the canonical record. Keep
tentative ideas, confirmed decisions and changes not yet conveyed distinguishable.
Do not interrupt productive discussion with routine relay or administration after
every settled point.

## 2. Answer project questions

Refresh relevant current summaries at useful conversation or decision points.
Obtain focused explanations from the best-informed role, including lower ranks
